<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a2e"/>
      <stop offset="100%" style="stop-color:#1e1050"/>
    </linearGradient>
    <linearGradient id="court" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Court outline -->
  <rect x="60" y="40" width="280" height="220" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.5"/>

  <!-- Center line -->
  <line x1="200" y1="40" x2="200" y2="260" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>

  <!-- Net -->
  <line x1="60" y1="150" x2="340" y2="150" stroke="#a5b4fc" stroke-width="2" opacity="0.7"/>
  <line x1="60" y1="145" x2="340" y2="145" stroke="#a5b4fc" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="155" x2="340" y2="155" stroke="#a5b4fc" stroke-width="0.5" opacity="0.3"/>

  <!-- Service lines -->
  <line x1="60" y1="90" x2="340" y2="90" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="210" x2="340" y2="210" stroke="#6366f1" stroke-width="1" opacity="0.3"/>

  <!-- Shuttlecock -->
  <circle cx="200" cy="110" r="8" fill="#f8fafc" opacity="0.9"/>
  <line x1="200" y1="118" x2="200" y2="138" stroke="#f8fafc" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="200" cy="138" rx="10" ry="6" fill="none" stroke="#f8fafc" stroke-width="1" opacity="0.5"/>

  <!-- Sportico wordmark area -->
  <text x="200" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6366f1" opacity="0.6" letter-spacing="3">SPORTICO</text>
</svg>
